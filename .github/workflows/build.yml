name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.8"
  SINGBOX_VERSION: "1.14.3"
  XRAY_VERSION: "26.10.21"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Install gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13

      - name: Build waycore AAR
        working-directory: core
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          go mod download
          gomobile init
          gomobile bind -v -o waycore.aar -target android -androidapi 24 -javapkg=io.mel0k1 -libname=waycore -trimpath -buildvcs=false -ldflags "-X github.com/sagernet/sing-box/constant.Version=${{ env.SINGBOX_VERSION }} -X runtime.godebugDefault=multipathtcp=0,tlssha1=1,tlsunsafeekm=1 -s -w -buildid= -checklinkname=0" -tags "with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0" ./mobile

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Bundle waycore AAR
        run: |
          mkdir -p android/app/libs
          cp core/waycore.aar android/app/libs/

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: way-android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build waycore.exe
        working-directory: core
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags "-s -w -buildid= -checklinkname=0 -X github.com/sagernet/sing-box/constant.Version=${{ env.SINGBOX_VERSION }} -X github.com/mel0k1/way/core.xrayVersion=${{ env.XRAY_VERSION }} -X runtime.godebugDefault=multipathtcp=0,tlssha1=1,tlsunsafeekm=1" -tags "with_gvisor,with_quic,with_utls,with_clash_api,with_wireguard,badlinkname,tfogo_checklinkname0" -o ../waycore.exe ./cmd/waycore

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Build app
        run: |
          flutter pub get
          flutter build windows --release

      - name: Bundle waycore.exe
        shell: pwsh
        run: Copy-Item waycore.exe build/windows/x64/runner/Release/ -Force

      - name: Bundle wintun.dll
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun
          Copy-Item wintun\wintun\bin\amd64\wintun.dll build\windows\x64\runner\Release\ -Force

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { $makensis = (Get-ChildItem "C:\Program Files*\NSIS\makensis.exe" | Select-Object -First 1).FullName }
          & $makensis "-DXBUILDDIR=$PWD\build\windows\x64\runner\Release" installer\way.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: way-windows
          path: dist/WaySetup.exe

  linux:
    name: Linux bundle and AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build waycore
        working-directory: core
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -buildid= -checklinkname=0 -X github.com/sagernet/sing-box/constant.Version=${{ env.SINGBOX_VERSION }} -X github.com/mel0k1/way/core.xrayVersion=${{ env.XRAY_VERSION }} -X runtime.godebugDefault=multipathtcp=0,tlssha1=1,tlsunsafeekm=1" -tags "with_gvisor,with_quic,with_utls,with_clash_api,with_wireguard,badlinkname,tfogo_checklinkname0" -o waycore ./cmd/waycore

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Build app
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release

      - name: Bundle core and runtime libs
        run: |
          cp core/waycore build/linux/x64/release/bundle/
          for lib in libayatana-appindicator3.so.1 libayatana-indicator3.so.1 libdbusmenu-glib.so.4 libdbusmenu-gtk3.so.4; do
            src="/usr/lib/x86_64-linux-gnu/$lib"
            if [ -f "$src" ]; then cp "$src" build/linux/x64/release/bundle/lib/; fi
          done

      - name: Pack tar.gz
        run: |
          mkdir -p dist/Way
          cp -r build/linux/x64/release/bundle/. dist/Way/
          tar -czf dist/Way-linux.tar.gz -C dist Way

      - name: Build AppImage
        run: |
          mkdir -p AppDir/opt/way
          cp -r build/linux/x64/release/bundle/. AppDir/opt/way/
          ln -s opt/way/way AppDir/AppRun
          cp packaging/linux/way.desktop AppDir/way.desktop
          cp assets/icon/way.png AppDir/way.png
          ln -s way.png AppDir/.DirIcon
          curl -fsSL -o appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract-and-run AppDir dist/Way-linux-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: way-linux
          path: dist/*

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp artifacts/way-android/app-release.apk dist/Way-${{ github.ref_name }}-android.apk
          cp artifacts/way-windows/WaySetup.exe dist/Way-${{ github.ref_name }}-setup.exe
          cp artifacts/way-linux/Way-linux.tar.gz dist/Way-${{ github.ref_name }}-linux-x86_64.tar.gz
          cp artifacts/way-linux/Way-linux-x86_64.AppImage dist/Way-${{ github.ref_name }}-linux-x86_64.AppImage

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
