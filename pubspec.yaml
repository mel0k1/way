name: way
description: "Way — cross-platform VPN client with sing-box and xray cores."
publish_to: "none"
version: 1.7.0+8

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  http: ^1.5.0
  path_provider: ^2.1.5
  flutter_secure_storage: ^11.2.0
  mobile_scanner: ^7.4.2
  system_tray: ^2.0.3
  file_selector: ^1.1.0
  yaml: ^3.1.3
  qr_flutter: ^4.1.0
  cryptography: ^2.7.0
  dynamic_color: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/way.png
    - assets/icon/way.ico
    - assets/icon/way_off.ico
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
